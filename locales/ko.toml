faq_label = "FAQ"
faq_title = "자주 묻는 질문"
q1 = "Mistly는 무료인가요?"
a1 = "네, Mistly는 완전히 무료입니다."
q2 = "관리자 권한이 필요한가요?"
a2 = "아니요. 설치 프로그램은 사용자 프로필에 설치되고, 포터블 버전은 설치가 필요 없습니다."
q3 = "Microsoft 계정 없이 플레이할 수 있나요?"
a3 = "Mistly는 Microsoft 로그인과 오프라인 계정을 모두 지원합니다. 원하는 쪽을 고르세요."
q4 = "모드는 어디에서 받나요?"
a4 = "Modrinth와 CurseForge에서 받습니다. 의존성은 자동으로 설치되고 모드팩은 클릭 한 번으로 가져옵니다."
q5 = "어떤 모드 로더를 지원하나요?"
a5 = "Forge, NeoForge, Fabric, Quilt, OptiFine, LiteLoader. Mistly는 선택한 버전에 존재하는 것만 보여 줍니다. 예를 들어 NeoForge는 1.20.1부터, LiteLoader는 1.12.2까지입니다. Quilt는 대부분의 Fabric 모드도 불러옵니다."

