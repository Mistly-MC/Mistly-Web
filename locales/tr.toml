faq_title = "Sık sorulan sorular"
q1 = "Mistly ücretsiz mi?"
a1 = "Evet, Mistly tamamen ücretsiz."
q2 = "Yönetici iznine ihtiyacım var mı?"
a2 = "Hayır. Kurulum kullanıcı profiline yapılır, taşınabilir sürüm ise hiç kurulmaz."
q3 = "Microsoft hesabı olmadan oynayabilir miyim?"
a3 = "Mistly hem Microsoft girişini hem de çevrimdışı hesapları destekler: seçim senin."
q4 = "Modlar nereden geliyor?"
a4 = "Modrinth ve CurseForge'dan. Bağımlılıklar otomatik kurulur ve mod paketleri tek tıkla içe aktarılır."
q5 = "Hangi mod yükleyiciler destekleniyor?"
a5 = "Forge, NeoForge, Fabric, Quilt, OptiFine ve LiteLoader. Mistly yalnızca seçilen sürüm için var olanları sunar: örneğin 1.20.1'den itibaren NeoForge, 1.12.2'ye kadar LiteLoader. Quilt ayrıca çoğu Fabric modunu da yükler."

