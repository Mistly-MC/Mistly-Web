faq_label = "FAQ"
faq_title = "Häufige Fragen"
q1 = "Ist Mistly kostenlos?"
a1 = "Ja, Mistly ist komplett kostenlos."
q2 = "Brauche ich Admin-Rechte?"
a2 = "Nein. Der Installer installiert in dein Benutzerprofil, und die portable Version wird gar nicht installiert."
q3 = "Kann ich ohne Microsoft-Konto spielen?"
a3 = "Mistly unterstützt die Microsoft-Anmeldung und Offline-Konten: Du hast die Wahl."
q4 = "Woher kommen die Mods?"
a4 = "Von Modrinth und CurseForge. Abhängigkeiten werden automatisch installiert und Modpacks mit einem Klick importiert."
q5 = "Welche Mod-Loader werden unterstützt?"
a5 = "Forge, NeoForge, Fabric, Quilt, OptiFine und LiteLoader. Mistly bietet nur die an, die es für die gewählte Version gibt: zum Beispiel NeoForge ab 1.20.1, LiteLoader bis 1.12.2. Quilt lädt auch die meisten Fabric-Mods."

