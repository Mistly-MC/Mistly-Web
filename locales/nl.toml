faq_title = "Veelgestelde vragen"
q1 = "Is Mistly gratis?"
a1 = "Ja, Mistly is helemaal gratis."
q2 = "Heb ik beheerdersrechten nodig?"
a2 = "Nee. De installer installeert in je gebruikersprofiel, en de portable versie installeert helemaal niets."
q3 = "Kan ik spelen zonder Microsoft-account?"
a3 = "Mistly ondersteunt inloggen met Microsoft en offline accounts: jij kiest."
q4 = "Waar komen de mods vandaan?"
a4 = "Van Modrinth en CurseForge. Afhankelijkheden worden automatisch geïnstalleerd en modpacks met één klik geïmporteerd."
q5 = "Welke modloaders worden ondersteund?"
a5 = "Forge, NeoForge, Fabric, Quilt, OptiFine en LiteLoader. Mistly biedt alleen aan wat er voor de gekozen versie bestaat: bijvoorbeeld NeoForge vanaf 1.20.1, LiteLoader tot 1.12.2. Quilt laadt ook de meeste Fabric-mods."

