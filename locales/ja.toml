faq_label = "よくある質問"
faq_title = "よくある質問"
q1 = "Mistly は無料ですか？"
a1 = "はい、Mistly は完全に無料です。"
q2 = "管理者権限は必要ですか？"
a2 = "いいえ。インストーラーはユーザープロファイルにインストールされ、ポータブル版はインストール自体が不要です。"
q3 = "Microsoft アカウントなしで遊べますか？"
a3 = "Mistly は Microsoft のサインインにもオフラインアカウントにも対応しています。どちらを使うかはあなた次第です。"
q4 = "Mod はどこから来るのですか？"
a4 = "Modrinth と CurseForge からです。依存関係は自動でインストールされ、Modpack はワンクリックでインポートできます。"
q5 = "どの Mod ローダーに対応していますか？"
a5 = "Forge、NeoForge、Fabric、Quilt、OptiFine、LiteLoader です。Mistly は選んだバージョンに存在するものだけを表示します。例えば NeoForge は 1.20.1 以降、LiteLoader は 1.12.2 までです。Quilt はほとんどの Fabric Mod も読み込めます。"

