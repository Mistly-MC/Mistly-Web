faq_title = "Pertanyaan umum"
q1 = "Apakah Mistly gratis?"
a1 = "Ya, Mistly sepenuhnya gratis."
q2 = "Apakah butuh hak admin?"
a2 = "Tidak. Penginstal memasang di profil penggunamu, dan versi portabel tidak perlu dipasang sama sekali."
q3 = "Bisakah bermain tanpa akun Microsoft?"
a3 = "Mistly mendukung login Microsoft dan akun offline: pilihan ada di tanganmu."
q4 = "Dari mana mod berasal?"
a4 = "Dari Modrinth dan CurseForge. Dependensi dipasang otomatis dan modpack diimpor dengan satu klik."
q5 = "Mod loader apa saja yang didukung?"
a5 = "Forge, NeoForge, Fabric, Quilt, OptiFine, dan LiteLoader. Mistly hanya menawarkan yang tersedia untuk versi pilihan: misalnya NeoForge mulai 1.20.1, LiteLoader sampai 1.12.2. Quilt juga memuat sebagian besar mod Fabric."

