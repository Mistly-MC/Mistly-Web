faq_label = "FAQ"
faq_title = "Najczęstsze pytania"
q1 = "Czy Mistly jest darmowy?"
a1 = "Tak, Mistly jest całkowicie darmowy."
q2 = "Czy potrzebuję uprawnień administratora?"
a2 = "Nie. Instalator instaluje w profilu użytkownika, a wersja przenośna w ogóle się nie instaluje."
q3 = "Czy mogę grać bez konta Microsoft?"
a3 = "Mistly obsługuje logowanie przez Microsoft i konta offline: wybór należy do ciebie."
q4 = "Skąd pochodzą mody?"
a4 = "Z Modrinth i CurseForge. Zależności instalują się automatycznie, a modpacki importujesz jednym kliknięciem."
q5 = "Które mod loadery są obsługiwane?"
a5 = "Forge, NeoForge, Fabric, Quilt, OptiFine i LiteLoader. Mistly proponuje tylko te, które istnieją dla wybranej wersji: na przykład NeoForge od 1.20.1, LiteLoader do 1.12.2. Quilt wczytuje też większość modów Fabric."

