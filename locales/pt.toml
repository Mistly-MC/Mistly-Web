faq_label = "FAQ"
faq_title = "Perguntas frequentes"
q1 = "O Mistly é gratuito?"
a1 = "Sim, o Mistly é totalmente gratuito."
q2 = "São precisos direitos de administrador?"
a2 = "Não. O instalador instala-se no teu perfil de utilizador e a versão portátil nem sequer se instala."
q3 = "Posso jogar sem conta Microsoft?"
a3 = "O Mistly suporta o início de sessão Microsoft e também contas offline: és tu que escolhes."
q4 = "De onde vêm os mods?"
a4 = "Do Modrinth e do CurseForge. As dependências são instaladas automaticamente e os modpacks importam-se num clique."
q5 = "Que mod loaders são suportados?"
a5 = "Forge, NeoForge, Fabric, Quilt, OptiFine e LiteLoader. O Mistly só propõe os que existem para a versão escolhida: por exemplo o NeoForge a partir da 1.20.1 e o LiteLoader até à 1.12.2. O Quilt também carrega a maioria dos mods Fabric."

