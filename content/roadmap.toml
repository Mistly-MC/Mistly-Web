# Roadmap de Mistly, affichée sur /roadmap.
#
# Une entrée [[item]] par chantier :
#   status  = "done" (terminé), "progress" (en cours) ou "planned" (prévu)
#   project = "launcher", "client", "site" ou "horizon"
#   title_fr, title_en, desc_fr, desc_en : le titre et une phrase, en français et en anglais
#   version = "0.5.0" (facultatif) : la version qui l'apporte
# Dans chaque colonne, les chantiers gardent l'ordre de ce fichier.

# ---------- En cours ----------

[[item]]
status = "progress"
project = "launcher"
version = "0.5.0"
title_fr = "Le nouveau design du launcher"
title_en = "The launcher's new design"
desc_fr = "Une barre latérale avec chaque page, des cartes en verre sur le paysage, la police Geist, et de nouveaux Paramètres rangés par catégories."
desc_en = "A sidebar with every page, glass cards over the landscape, the Geist font, and new Settings sorted into categories."

[[item]]
